services:
  # Persistent Python service wrapping yt-dlp for metadata extraction
  yt-media-info-service:
    build:
      context: ./service
      dockerfile: Dockerfile
    image: yt-media-info-service
    container_name: yt-media-info-service
    expose:
      - "8000" # internal only, not published to host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file: .env
    networks:
      - yt-media-info-network
    volumes:
      - cookies-data:/data:ro

  # Node MCP server exposing yt-dlp capabilities via MCP stdio/SSE
  yt-media-info-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-media-info-mcp
    container_name: yt-media-info-mcp
    restart: unless-stopped
    ports:
      - "${YT_MEDIA_INFO_PORT:-9423}:${YT_MEDIA_INFO_PORT:-9423}"
    env_file: .env
    environment:
      # Override for Docker networking: Python service is reachable by service name
      YT_MEDIA_INFO_SERVICE_URL: http://yt-media-info-service:8000
    depends_on:
      yt-media-info-service:
        condition: service_healthy
    networks:
      - yt-media-info-network

  # Playwright+Chromium sidecar for automated cookie refresh (opt-in via --profile cookies)
  cookie-bot:
    build:
      context: ./cookie-bot
      dockerfile: Dockerfile
    image: cookie-bot
    container_name: cookie-bot
    profiles:
      - cookies
    env_file: .env
    environment:
      COOKIE_BOT_DATA_DIR: /data
      COOKIE_BOT_COOKIE_FILE: /data/cookies.txt
    volumes:
      - cookies-data:/data
    networks:
      - yt-media-info-network
    restart: unless-stopped

networks:
  yt-media-info-network:
    driver: bridge

volumes:
  cookies-data:
