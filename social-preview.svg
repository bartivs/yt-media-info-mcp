<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid of dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="60" cy="60" r="3"/><circle cx="120" cy="60" r="3"/><circle cx="180" cy="60" r="3"/>
    <circle cx="60" cy="120" r="3"/><circle cx="120" cy="120" r="3"/><circle cx="180" cy="120" r="3"/>
    <circle cx="60" cy="600" r="3"/><circle cx="120" cy="600" r="3"/><circle cx="180" cy="600" r="3"/>
    <circle cx="1180" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/><circle cx="1180" cy="120" r="3"/>
  </g>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <!-- title -->
  <text x="100" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">yt-media-info MCP</text>

  <!-- tagline -->
  <text x="100" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#c9d1d9">
    Extract metadata, transcripts &amp; search from any media URL — for AI.
  </text>

  <!-- description -->
  <text x="100" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#8b949e">
    Model Context Protocol server powered by yt-dlp — 1800+ sites supported.
  </text>

  <!-- pill badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">
    <!-- MCP -->
    <rect x="100" y="360" width="156" height="58" rx="29" fill="#2d1b4d" stroke="#7c3aed" stroke-width="2"/>
    <text x="178" y="398" text-anchor="middle" fill="#c4b5fd">MCP Server</text>

    <!-- yt-dlp -->
    <rect x="276" y="360" width="156" height="58" rx="29" fill="#3a0d0d" stroke="#ff0000" stroke-width="2"/>
    <text x="354" y="398" text-anchor="middle" fill="#ff8a80">yt-dlp</text>

    <!-- Docker -->
    <rect x="452" y="360" width="156" height="58" rx="29" fill="#0d2340" stroke="#2563eb" stroke-width="2"/>
    <text x="530" y="398" text-anchor="middle" fill="#93c5fd">Docker</text>

    <!-- Claude -->
    <rect x="628" y="360" width="156" height="58" rx="29" fill="#2a2117" stroke="#d97757" stroke-width="2"/>
    <text x="706" y="398" text-anchor="middle" fill="#f0c8a8">Claude</text>
  </g>

  <!-- feature bullets -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    <circle cx="112" cy="468" r="5" fill="#7c3aed"/>
    <text x="132" y="476">extract_info — titles, chapters, stats, formats</text>
    <circle cx="112" cy="512" r="5" fill="#7c3aed"/>
    <text x="132" y="520">get_transcript — subtitles in any language</text>
    <circle cx="112" cy="556" r="5" fill="#7c3aed"/>
    <text x="132" y="564">search_media — find videos across platforms</text>
  </g>

  <!-- play button icon, right side -->
  <g transform="translate(1010,250)" filter="url(#glow)">
    <circle cx="120" cy="120" r="116" fill="url(#play)"/>
    <polygon points="96,72 96,168 180,120" fill="#ffffff"/>
  </g>
  <text x="1130" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#6e7681">YouTube · Vimeo · Twitch · +1800</text>

  <!-- bottom bar -->
  <rect x="0" y="624" width="1280" height="16" fill="url(#accent)" opacity="0.5"/>
</svg>
